services:
  postgres:
    image: postgres:18-alpine
    container_name: businessflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: businessflow
      POSTGRES_PASSWORD: businessflow
      POSTGRES_DB: businessflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - businessflow_postgres_data:/var/lib/postgresql
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessflow -d businessflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  businessflow_postgres_data:
