name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: businessflow
          POSTGRES_PASSWORD: businessflow
          POSTGRES_DB: businessflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U businessflow -d businessflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://businessflow:businessflow@localhost:5432/businessflow?schema=public
      TEST_DATABASE_URL: postgresql://businessflow:businessflow@localhost:5432/businessflow_test?schema=public
      E2E_DATABASE_URL: postgresql://businessflow:businessflow@localhost:5432/businessflow_e2e?schema=public
      AUTH_SECRET: ci-only-businessflow-auth-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        env:
          PGPASSWORD: businessflow
        run: |
          psql -h localhost -U businessflow -d businessflow -c 'CREATE DATABASE businessflow_test;'
          psql -h localhost -U businessflow -d businessflow -c 'CREATE DATABASE businessflow_e2e;'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Integration database
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:deploy
      - run: pnpm test:integration
      - name: E2E database
        run: |
          DATABASE_URL="$E2E_DATABASE_URL" pnpm db:deploy
          DATABASE_URL="$E2E_DATABASE_URL" pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
